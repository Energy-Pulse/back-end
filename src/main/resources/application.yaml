spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/energy_pulse
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    context-path: /api